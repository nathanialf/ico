name: Deploy progress dashboard (retail)

# Publish the TWO-VERSION static progress dashboard to GitHub Pages on every
# push to the retail branch. The site is assembled identically by this
# workflow and by main's twin (once main adopts it), so whichever branch
# deploys last produces the same site and last-push-wins is harmless:
#
#   _site/index.html          — version-toggle dashboard (this branch's copy)
#   _site/aug6/progress.json  — from origin/main:docs/progress.json
#   _site/us/progress.json    — from this branch's docs/progress.json
#   _site/progress.json       — aug6 copy at the root, so a cached pre-toggle
#                               index.html keeps working
on:
  push:
    branches: [retail, retail-v2]
    paths:
      - docs/index.html
      - docs/progress.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with main's pages workflow: one in-flight deploy at a time across
# BOTH branches; don't cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (this branch)
        uses: actions/checkout@v5

      - name: Assemble two-version site
        run: |
          set -eu
          mkdir -p _site/aug6 _site/us
          cp docs/index.html _site/index.html
          cp docs/progress.json _site/us/progress.json
          # aug6 JSON from main; tolerate a missing file (site still renders us)
          git fetch --depth=1 origin main
          if git show origin/main:docs/progress.json > _site/aug6/progress.json 2>/dev/null; then
            cp _site/aug6/progress.json _site/progress.json
          else
            rm -f _site/aug6/progress.json
            cp docs/progress.json _site/progress.json
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
