name: Deploy progress dashboard

# Publish the SIX-VERSION static progress dashboard to GitHub Pages.
#
# Every target's numbers come from its own branch: pal -> pal (PAL retail
# SCES-50760), jpn -> jpn (Japanese retail SCPS-11003), kor -> kor (Korean
# retail SCPS-56001), ntsc -> ntsc (USA retail, SLUS-20218), aug6 -> aug6
# (Aug-6-2001 prototype) and jun26 -> jun26 (Jun-26-2001 demo). main builds
# the joined targets (pal, jpn, kor) in one tree and keeps their docs/<slug>/
# as its build's progress record, but the site never reads them from main.
#
# Each branch runs its own copy of this workflow and of
# .github/scripts/build_pages_site.sh; the copies are identical (the shared
# layer, tools/check_shared_layer.sh) and main's is where a change lands
# first. A Pages deploy replaces the ENTIRE site, so every copy assembles the
# complete site (pal + jpn + kor + ntsc + aug6 + jun26) from the branches'
# progress files, or whichever branch deployed last would 404 the other
# versions' data. A push to any of the seven branches deploys.
#
# The dashboard page, docs/index.html, is read from `main` only, whichever
# branch runs the deploy; each other branch contributes just its target's
# progress.json and PROGRESS.md. A page change lands on `main` first and the
# other branches carry the same copy as part of the shared layer.
#
# See .github/scripts/build_pages_site.sh for the layout it produces.
on:
  push:
    branches: [main, pal, jpn, kor, ntsc, aug6, jun26]
    # Only the files the site actually serves. docs/ also holds the project's
    # documentation, and a documentation edit is not a reason to redeploy.
    paths:
      - docs/index.html
      - docs/*/progress.json
      - docs/*/PROGRESS.md
      - .github/workflows/pages.yml
      - .github/scripts/build_pages_site.sh
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Shared across ALL publishing branches: one in-flight deploy at a time; don't
# cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

# Force JS actions onto Node.js 24: Node 20 is deprecated on the runners.
# Covers actions still pinned to Node 20 internally (configure-pages@v5,
# upload-pages-artifact@v3, deploy-pages@v4) until they ship a Node-24 major.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (this branch)
        uses: actions/checkout@v5

      - name: Assemble the site, every target from its own branch
        run: .github/scripts/build_pages_site.sh "${{ github.ref_name }}"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site automatically if it doesn't exist yet, so the
          # first deploy doesn't fail with "Get Pages site failed" (404).
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
