name: Deploy progress dashboard

# Publish the TWO-VERSION static progress dashboard to GitHub Pages.
#
# This workflow, .github/scripts/build_pages_site.sh and docs/index.html are
# byte-identical on `main` and `retail-v2` — deliberately, with no per-branch
# conditionals. A Pages deploy replaces the ENTIRE site, so both branches must
# assemble the same complete site (aug6 + us) or whichever branch deployed last
# would 404 the other version's data. Fix these files on one branch and copy
# them verbatim to the other; the assemble script warns if they drift.
#
# See .github/scripts/build_pages_site.sh for the layout it produces.
on:
  push:
    branches: [main, retail-v2]
    paths:
      - docs/**
      - .github/workflows/pages.yml
      - .github/scripts/build_pages_site.sh
  workflow_dispatch:

# Allow the GITHUB_TOKEN to deploy to Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Shared across BOTH branches: one in-flight deploy at a time; don't cancel a
# running one.
concurrency:
  group: pages
  cancel-in-progress: false

# Force JS actions onto Node.js 24 — Node 20 is deprecated on the runners.
# Covers actions still pinned to Node 20 internally (configure-pages@v5,
# upload-pages-artifact@v3, deploy-pages@v4) until they ship a Node-24 major.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (this branch)
        uses: actions/checkout@v5

      - name: Assemble two-version site
        run: .github/scripts/build_pages_site.sh "${{ github.ref_name }}"

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # Create the Pages site automatically if it doesn't exist yet, so the
          # first deploy doesn't fail with "Get Pages site failed" (404).
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
