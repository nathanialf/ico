# =============================================================================
# splat configuration — ICO Aug-6-2001 PROTOTYPE (SCUS_971.13, SCEA NA)
#
# This is the `aug6` retarget branch. The target is the EE boot ELF of the
# Aug-6-2001 prototype disc (baserom/aug6/baseelf.rom). Unlike the retail
# `main` branch, this build has a shipped GNU ld linker map (MAIN.MAP) on the
# disc, so symbol names + per-TU file boundaries are known a priori:
#   - config/symbol_addrs.us.txt    (5191 symbols recovered from MAIN.MAP)
#   - baserom/aug6/text_tu_boundaries.txt  (221 ico2000.a .text TU ranges)
# See docs/LEGAL.md for the disc-shipped-symbol-metadata provenance rationale.
#
# Seeded with one large `asm` .text subsegment; flip [ADDR, asm] -> [ADDR, c,
# name] (carving along the MAIN.MAP TU boundaries) as matching progresses.
# =============================================================================

name: ico
sha1: 2b4d7de41966ff38d061b4c985de45fc212e2fb2  # SHA-1 of baserom/aug6/baseelf.rom
options:
  basename: ico
  target_path: baserom/aug6/baseelf.rom
  elf_path: build/ico.elf
  base_path: ..
  platform: ps2
  compiler: EEGCC

  # _gp from MAIN.MAP (authoritative: what crt0 loads at runtime). splat's
  # create_config heuristic guessed cod_LIT4_START+0x7FF0=0x632A70; the real
  # linker assigned _gp=0x630BF0. Pin the literal so the link reproduces it
  # (verified: pinning fixes the GPREL16 overflow).
  gp_value: 0x00630BF0
  ld_gp_expression: "0x00630BF0"

  asm_path: asm/aug6
  src_path: .
  build_path: build
  hasm_in_src_path: True

  generate_asm_macros_files: False

  ld_script_path: config/ico.aug6.ld
  ld_dependencies: True
  ld_wildcard_sections: True
  ld_bss_contains_common: True
  ld_bss_is_noload: true

  create_asm_dependencies: True
  disassemble_all: True

  find_file_boundaries: False
  migrate_rodata_to_functions: True
  use_gp_rel_macro_nonmatching: True

  o_as_suffix: True

  symbol_addrs_path:
    - config/symbol_addrs.aug6.txt
  reloc_addrs_path:
    - config/reloc_addrs.aug6.txt

  undefined_funcs_auto_path: config/undefined_funcs_auto.aug6.txt
  undefined_syms_auto_path: config/undefined_syms_auto.aug6.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  named_regs_for_c_funcs: False

  section_order:
    - .text
    # - .vutext (textbin — VU code, not auto-disassembled)
    - .data
    - .rodata
    - .lit4
    - .sdata
    - .sbss
    - .bss

  auto_link_sections:
    - .data
    - .rodata
    - .lit4
    - .sdata
    - .sbss
    - .bss

# One large `asm` .text subsegment to start (mirrors how the retail branch was
# bootstrapped). Section boundaries below are aug6-specific (from the ELF).
segments:
  - name: cod
    type: code
    start: 0x000000
    vram: 0x00100000
    bss_size: 0xEA48C
    subalign: null
    align: 0x80   # original linker 0x80-aligns every section start (.data/.rodata/.lit4/.sdata/.sbss/.bss); splat default is 16
    subsegments:
      - [0x000000, asm, src/cod/000000]      # crt0 + libkernl (vendor, not matched)
