# =============================================================================
# splat configuration — ICO (PAL retail SCES-50760, boot ELF SCES_507.60)
#
# main (PAL) 2026-09-04: the retail target moved from the USA disc to the PAL
# disc. Same toolchain and conventions as the ntsc/aug6 branches (ee-gcc
# 2.9-991111-01 + period ee-as, zero bandaids, raw one-pass splat round-trip,
# per-TU yaml data carving). USA retail (SCUS_971.13) now lives on the `ntsc`
# branch; the Aug-6-2001 prototype on `aug6`.
#
# The PAL disc ships MAIN.MAP / SRCFILE.TXT / TRFILE.TXT (a linker map and an
# objdump -dl listing of the 2002-01-16 EU master link). Names and TU order
# come from them via tools/gen_pal_symbol_addrs.py; see docs/LEGAL.md.
# Version slug: 'pal'.
#
# .text is split per translation unit (223 game TUs + 18 vendor-archive spans) by
# tools/gen_pal_symbol_addrs.py; flip [OFF, asm, NAME] -> [OFF, c, NAME] as
# TUs are ported from ntsc / matched.  Rerunning the generator preserves a
# flipped subsegment's type and name.
# =============================================================================

name: ico
sha1: a401d1e5a20b1659189a8b1026a8eb35811dc9ca  # SHA-1 of baserom/pal/baseelf.rom
options:
  basename: ico
  target_path: baserom/pal/baseelf.rom
  elf_path: build/ico.elf
  base_path: ..
  platform: ps2
  compiler: EEGCC

  # _gp from the PAL ELF's own .reginfo section (ri_gp_value = 0x00640AF0 —
  # what crt0 loads at runtime). Pinned so the link reproduces it unconditionally.
  gp_value: 0x00640AF0
  ld_gp_expression: "0x00640AF0"

  asm_path: asm
  src_path: .
  build_path: build
  hasm_in_src_path: True

  # Lock include/{labels.inc,macro.inc} — hand-edited (`jlabel visibility=global`
  # so cross-.o jumptable refs in coalesced TUs resolve at link time); splat's
  # default regen would revert that.
  generate_asm_macros_files: False

  ld_script_path: config/ico.pal.ld
  ld_dependencies: True
  ld_wildcard_sections: True
  ld_bss_contains_common: True
  ld_bss_is_noload: true

  create_asm_dependencies: True
  disassemble_all: True

  find_file_boundaries: False
  migrate_rodata_to_functions: True
  use_gp_rel_macro_nonmatching: True

  o_as_suffix: True

  symbol_addrs_path:
    - config/symbol_addrs.pal.txt
  reloc_addrs_path:
    - config/reloc_addrs.pal.txt

  undefined_funcs_auto_path: config/undefined_funcs_auto.pal.txt
  undefined_syms_auto_path: config/undefined_syms_auto.pal.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  named_regs_for_c_funcs: False

  section_order:
    - .text
    # - .vutext (hasm — hand-typed VU1 microprograms, src/*.S via assemble_vu0.py)
    - .data
    - .rodata
    - .lit4
    - .sdata
    - .sbss
    - .bss

  auto_link_sections:
    - .data
    - .rodata
    - .lit4
    - .sdata
    - .sbss
    - .bss

# Section boundaries below are PAL-specific (from baserom/pal/baseelf.elf
# section headers; every section start is 0x80-aligned by the original
# linker, hence align: 0x80).
segments:
  - name: cod
    type: code
    start: 0x000000
    vram: 0x00100000
    bss_size: 0xFA074   # .sbss 0x4DC + .bss 0xF9B98
    subalign: null
    align: 0x80   # original linker 0x80-aligns every section start; splat default is 16
    subsegments:
      # --- .text 0x00100000..0x00289BC4 (+12 B pad folded into the last span,
      # which therefore runs to the 0x00289BD0 .vutext start).  One subsegment
      # per translation unit, in link order, recovered by
      # tools/gen_pal_symbol_addrs.py from the PAL disc's own SRCFILE.TXT /
      # MAIN.MAP metadata — read the provenance header in
      # config/symbol_addrs.pal.txt before trusting a name.  Every start below
      # is a rom-native, 8-byte-aligned function start (an unaligned split
      # would make the assembler insert pad and break the SHA-1).
      #
      # `src/cod/vendor_*` spans are library archive members, NOT ICO TUs.
      # They are named by VMA — a file named `libc` would assert a per-file
      # partition this tree has not verified — while the trailing comment
      # names the archive MAIN.MAP's symbol table attributes the span's
      # functions to.  Attribution tags: `census` = the rom's own __FILE__
      # string proves the file; `listing` = carried over from SRCFILE.TXT by
      # reloc-normalized instruction-stream equality; `fill` = forward-filled
      # inside an already-attributed region.
      #
      # Everything is `asm` until a TU is ported from ntsc or matched; flip
      # [OFF, asm, NAME] -> [OFF, c, NAME] as that happens.  Regenerating
      # preserves the type and name of any subsegment whose start offset
      # survives, so a flipped TU is not clobbered.
      - [0x0, asm, src/cod/vendor_100000]  # 3 funcs, vendor unattributed
      - [0x110, asm, src/cod/vendor_100110]  # 177 funcs, vendor libkernl.a (164/177 MAIN.MAP)
