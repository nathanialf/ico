# =============================================================================
# splat configuration — ICO (USA, SCUS-97113)
#
# Initial config bootstrapped via `splat create_config baserom/baseelf.elf`
# and adapted to the project's directory layout. The matching target is the
# objcopy-flattened .rom (sha1 below); the build chain produces:
#
#   objects → ld → build/ico.elf → objcopy -O binary → build/ico.rom
#
# and the .rom is sha1-verified against config/sha1sums.txt.
#
# Note: ICO is on disc as SCUS_971.13 (SCEA, North America). The on-disc
# filename uses the SCUS prefix; SLUS-20218 references some retail metadata
# but the actual boot ELF is SCUS_971.13. We use 'us' as the version slug.
# =============================================================================

name: ico
sha1: fbf50c75cd5911273511c4f9af90503ff8423582  # SHA-1 of baserom/baseelf.rom
options:
  basename: ico
  target_path: baserom/baseelf.rom
  elf_path: build/ico.elf
  base_path: ..
  platform: ps2
  compiler: EEGCC

  gp_value: 0x006388F0
  ld_gp_expression: cod_LIT4_START + 0x7FF0

  asm_path: asm
  src_path: src
  build_path: build

  ld_script_path: config/ico.us.ld
  ld_dependencies: True
  ld_wildcard_sections: True
  ld_bss_contains_common: True
  ld_bss_is_noload: true

  create_asm_dependencies: True
  disassemble_all: True

  find_file_boundaries: False
  migrate_rodata_to_functions: True
  use_gp_rel_macro_nonmatching: False

  o_as_suffix: True

  symbol_addrs_path:
    - config/symbol_addrs.us.txt
  reloc_addrs_path:
    - config/reloc_addrs.us.txt

  undefined_funcs_auto_path: config/undefined_funcs_auto.us.txt
  undefined_syms_auto_path: config/undefined_syms_auto.us.txt

  string_encoding: ASCII
  data_string_encoding: ASCII
  rodata_string_guesser_level: 2
  data_string_guesser_level: 2

  named_regs_for_c_funcs: False

  section_order:
    - .text
    # - .vutext (textbin — VU code, not auto-disassembled)
    - .data
    - .rodata
    - .lit4
    - .sdata
    - .sbss
    - .bss

  auto_link_sections:
    - .data
    - .rodata
    - .lit4
    - .sdata
    - .sbss
    - .bss

