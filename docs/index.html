<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICO decompilation progress</title>
<style>
  /* ------------------------------------------------------------------ *
   * Self-contained on purpose: no fonts, no CDN, no build step. The only
   * network traffic this page makes is the same-origin progress.json
   * fetches at the bottom of the script.
   *
   * The look is ported from the author's site (defnf.com, the
   * React-Portfolio Next.js app): near-black ground, hairline borders,
   * square corners, no shadows anywhere, dense mono micro-labels, one
   * serif for headings, and a single sand accent — the ICO entry's own
   * colour on the portfolio (src/data/projects.ts, hoverColor '#d9c9a3').
   *
   * FONTS: the portfolio loads Playfair Display / Outfit / JetBrains Mono
   * from next/font (src/app/layout.tsx:52-68). Fetching them here would be
   * a CDN request, which this page does not do, so each family is NAMED
   * FIRST — a local install is used when the visitor has one — with a
   * system stack behind it. Nothing is downloaded either way.
   *
   * COLOUR: the ramp is the portfolio's own (Tailwind-neutral #0a0a0a ->
   * #f9fafb, plus the ICO card's sand). The portfolio spends #404040 / #525252 /
   * #737373 on small text, which measures 1.9:1 / 2.5:1 / 4.2:1 on its own
   * #0a0a0a ground. Every one of those roles is taken ONE STEP UP the same
   * ladder here, so text clears WCAG 1.4.3 (4.5:1) and control outlines
   * clear 1.4.11 (3:1). Measured ratios sit beside each token.
   * ------------------------------------------------------------------ */
  :root {
    color-scheme: dark;               /* dark native scrollbars + form controls */

    /* -- surfaces (portfolio ToolPage.module.css:7, UI.module.css:87/98,
          FormControls.module.css:41) ------------------------------------- */
    --bg:#0a0a0a; --panel:#0d0d0d; --field:#171717; --hover:#171717;
    /* -- hairline (UI.module.css:53 / FormControls.module.css:33). The site's
          softer #1a1a1a rule is deliberately NOT used: at 1.1:1 it disappears,
          and every hairline here is load-bearing structure. ---------------- */
    --line:#262626;

    /* -- text ramp, ratios measured against --bg ---------------------- */
    --fg:#e5e5e5;      /* 15.7:1 — UI.module.css:103, ToolPage.module.css:69 */
    --fg2:#d4d4d4;     /* 13.4:1 — UI.module.css:69 section titles          */
    --dim:#a3a3a3;     /*  7.9:1 — MainLayout.module.css:248                */
    --faint:#8a8a8a;   /*  5.7:1 — one notch above the site's #737373 (4.2:1)*/
    --ctl:#737373;     /*  4.2:1 — control outline; the site's #525252 is
                                   2.5:1 and would fail WCAG 1.4.11         */

    /* -- accent + status ---------------------------------------------- */
    --accent:#d9c9a3;  /* 12.1:1 — the ICO project card's hoverColor,
                                   src/data/projects.ts                    */
    --on-accent:#0a0a0a;              /* 12.1:1 the other way round          */
    /* Focus is its OWN channel, not the accent: the selected segment is
       already an accent-coloured fill, and a sand ring on a sand button is
       1:1. #f9fafb (MainLayout.module.css:225) is 19:1 on --bg, and the 2px
       outline-offset keeps --bg between the ring and any fill it sits on. */
    --focus:#f9fafb;
    --bar:#262626;                    /* progress track — FormControls:76    */
    --warn:#d4a000; --warn-bg:#2d2000; --warn-line:#4d3800;  /* FormControls:188-194 */
    --err:#f87171;     /*  7.2:1 — same Tailwind family as the site's
                                   project colours (global.css:10-13)        */
    --mkn:var(--faint);               /* "unmatched" marker — 5.7:1 on --bg  */
    --layer:rgba(229,229,229,.08);    /* hover state layer: on-surface @ 8%  */

    /* -- type (see FONTS above) ---------------------------------------- */
    --f-body: "Outfit", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --f-serif: "Playfair Display", "Times New Roman", Times, serif;
    --f-mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;

    --maxw:1040px;
    --ease:cubic-bezier(.4,0,.2,1);   /* MainLayout.module.css:291           */

    /* Row column widths live here so the breakpoints below only retune
       numbers. A column set to `display:none` is dropped, not squeezed. */
    --pad-x:16px;  --indent:12px;  --gap-col:8px;  --row-y:4px;
    --w-bar:64px;  --w-pct:44px;   --w-sz:58px;
  }
  @media (min-width:560px) {
    :root { --pad-x:20px; --indent:16px; --gap-col:10px; --row-y:5px;
            --w-bar:110px; --w-pct:48px; --w-cnt:84px; --w-sz:62px; }
  }
  @media (min-width:900px) {
    :root { --pad-x:24px; --indent:18px; --row-y:5px;
            --w-bar:160px; --w-pct:52px; --w-cnt:96px; --w-sz:70px; }
  }

  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--bg); color:var(--fg2);
    font:13px/1.6 var(--f-body);
    -webkit-text-size-adjust:100%;
  }
  .wrap { max-width:var(--maxw); margin:0 auto; padding-inline:var(--pad-x); }

  /* ---------- header ---------- *
   * ToolPage.module.css:43-90: serif uppercase title, mono sub-line, the
   * whole block closed off by a single hairline rule. */
  header { padding:32px 0 0; }
  @media (min-width:900px) { header { padding:48px 0 0; } }
  .head {
    display:flex; flex-wrap:wrap; gap:16px 24px;
    align-items:flex-end; justify-content:space-between;
    border-bottom:1px solid var(--line); padding-bottom:12px;
  }
  h1 {
    font:700 24px/1.2 var(--f-serif); color:var(--fg);
    margin:0 0 8px; letter-spacing:.04em; text-transform:uppercase;
    text-wrap:balance;
  }
  @media (max-width:559px) { h1 { font-size:20px; } }
  /* The sub-line keeps sentence case: it is prose, and it names a path. */
  .sub { font-family:var(--f-mono); font-size:12px; color:var(--dim);
         margin:0; max-width:62ch; text-wrap:pretty; }
  /* Links follow the site's rule-under-the-word treatment
     (Blog.module.css:296-306), lifted out of its #525252 (2.5:1). */
  a { color:var(--fg); text-decoration:none;
      border-bottom:1px solid var(--ctl);
      transition:color 150ms ease, border-color 150ms ease; }
  a:hover { color:var(--accent); border-color:var(--accent); }
  a:focus-visible, .row:focus-visible, input:focus-visible {
    outline:2px solid var(--focus); outline-offset:2px; border-radius:0;
  }

  /* ---------- version picker: single-select segmented button ---------- *
   * ARIA first: a single-select segmented control "behave[s] like radio
   * buttons … the label is Radiogroup", so it gets ONE tab stop (roving
   * tabindex) plus arrow/Home/End, and the exposed role and the keyboard
   * behaviour agree.
   * Selection is signalled by the container fill alone (no icon): a light
   * fill on the dark ground is a luminance change, not just a hue change,
   * and aria-checked carries it to assistive tech.
   * The metrics are the portfolio's nav buttons (MainLayout.module.css:
   * 116-129, 240-261): square, 1px outline, transparent until selected,
   * solid accent fill when it is — over a 40px container that still gets a
   * 48px touch target. */
  /* Sits beside the title when there is room, drops to its own row and fills
     the column when there isn't — but never stretches past a comfortable
     control width. */
  .verpick { display:flex; flex-direction:column; gap:8px; flex:1 1 260px; max-width:420px; }
  .verpick-lbl {
    font-family:var(--f-mono); font-size:11px; color:var(--dim);
    text-transform:uppercase; letter-spacing:.1em;
  }
  .seg { display:flex; }
  .seg-btn {
    flex:1 1 auto; position:relative; display:inline-flex; align-items:center;
    justify-content:center; gap:6px; min-height:40px; padding:0 10px;
    text-align:center;
    font:500 12px/1 var(--f-mono); letter-spacing:.06em; text-transform:uppercase;
    background:transparent; color:var(--fg2);
    border:1px solid var(--ctl); border-radius:0; cursor:pointer;
    transition:background-color 150ms ease, color 150ms ease, border-color 150ms ease;
  }
  .seg-btn + .seg-btn { margin-left:-1px; }            /* collapse shared edge */
  /* A 48px target on a 40px container: grow the hit area without growing the
     button. Offsets are 5px, not 4px, because an absolutely positioned child
     is laid out against the padding box — the 1px outline would otherwise eat
     2px of the target. */
  .seg-btn::after { content:""; position:absolute; inset:-5px 0; }
  .seg-btn:hover { background:var(--layer); color:var(--fg); }
  .seg-btn[aria-checked="true"] {
    background:var(--accent); border-color:var(--accent); color:var(--on-accent);
    z-index:1;
  }
  .seg-btn[aria-checked="true"]:hover {
    background:linear-gradient(rgba(10,10,10,.10),rgba(10,10,10,.10)) var(--accent);
  }
  /* Focus ring: 3px, 2px outward offset. Shape change, not colour change. */
  .seg-btn:focus-visible {
    outline:3px solid var(--focus); outline-offset:2px; z-index:2;
  }

  /* ---------- summary ---------- *
   * One panel with hairline-divided cells rather than four floating cards:
   * fewer boxes, and the two percentage cells can carry the same bar the
   * tree uses, which ties the summary to the rows below it. The 1px grid
   * gap over a --line ground is how the portfolio draws its tables and
   * phase strips (UI.module.css:237-253, Blog.module.css:326-349). */
  .stats {
    display:grid; grid-template-columns:1fr; gap:1px;
    margin:24px 0 0; background:var(--line);
    border:1px solid var(--line); border-radius:0;
  }
  @media (min-width:560px) { .stats { grid-template-columns:repeat(2,1fr); } }
  @media (min-width:900px) { .stats { grid-template-columns:repeat(4,1fr); } }
  .card {
    background:var(--panel); padding:10px 14px;
    display:flex; flex-direction:row-reverse; justify-content:space-between;
    align-items:baseline; gap:12px;
  }
  /* The value is the payload: it never wraps. The label gives up room first. */
  .card .n { flex:0 0 auto; white-space:nowrap; color:var(--fg);
             font:500 17px/1.2 var(--f-mono); letter-spacing:-.01em;
             font-variant-numeric:tabular-nums; }
  .card .l { flex:0 1 auto; font-family:var(--f-mono); font-size:10px;
             color:var(--dim); text-transform:uppercase; letter-spacing:.1em; }
  .card .bar { display:none; }
  @media (min-width:560px) {
    .card {
      flex-direction:column; align-items:stretch; justify-content:flex-start;
      gap:6px; padding:14px 16px;
    }
    .card .n { font-size:19px; }
    .card .bar { display:block; flex:none; width:100%; margin-top:auto; }
  }

  /* ---------- toolbar ---------- *
   * Field and label are FormControls.module.css:9-51 verbatim except for the
   * outline colour, which the contrast note at the top explains. */
  main { padding-block:8px 60px; }
  .toolbar { display:flex; gap:10px 16px; align-items:center; margin:24px 0 10px; flex-wrap:wrap; }
  input[type=search] {
    background:var(--field); border:1px solid var(--ctl); color:var(--fg);
    border-radius:0; -webkit-appearance:none; appearance:none;
    padding:8px 10px; font:12px/1 var(--f-mono);
    flex:1 1 220px; min-width:0; max-width:340px; min-height:36px;
    transition:border-color 150ms ease;
  }
  input[type=search]:hover { border-color:var(--dim); }
  input[type=search]::placeholder { color:var(--dim); opacity:1; }
  label.chk {
    font-family:var(--f-mono); font-size:11px; color:var(--dim);
    text-transform:uppercase; letter-spacing:.06em;
    user-select:none; cursor:pointer;
    display:inline-flex; align-items:center; gap:7px; min-height:36px;
    transition:color 150ms ease;
  }
  label.chk:hover { color:var(--fg); }
  input[type=checkbox] { accent-color:var(--accent); width:14px; height:14px; margin:0; }

  /* ---------- tree ---------- */
  .row {
    display:flex; align-items:center; gap:var(--gap-col);
    padding:var(--row-y) 6px; border-radius:0;
    transition:background-color 150ms ease;
  }
  .row.prog, .row.tu {
    cursor:pointer; width:100%; text-align:left; font:inherit; color:inherit;
    background:none; border:0;
  }
  .row.prog:hover, .row.tu:hover { background:var(--hover); }
  .row:focus-visible { outline:2px solid var(--focus); outline-offset:-2px; }
  /* Group rows are this page's section headings, so they take the site's
     serif (UI.module.css:65-73) — but NOT its uppercase: these are real
     directory names and a decomp reader needs their case intact. */
  .row.prog .nm { font-family:var(--f-serif); font-weight:700; font-size:15px;
                  letter-spacing:.04em; color:var(--fg2); }
  .row.tu .nm { font-family:var(--f-mono); font-size:12px; color:var(--fg); }

  .tw { width:14px; flex:0 0 14px; color:var(--faint); font-size:9px; text-align:center; }
  .tw::before {
    content:"\25B6"; display:inline-block;
    transition:transform 150ms var(--ease);
  }
  .open > .row > .tw::before { transform:rotate(90deg); }

  .nm { flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .func .nm { font-family:var(--f-mono); font-size:12px; color:var(--dim); }
  .bar { flex:0 0 var(--w-bar); height:6px; background:var(--bar); border-radius:0; overflow:hidden; }
  .bar > i { display:block; height:100%; background:var(--accent); }
  .pct { width:var(--w-pct); flex:0 0 auto; text-align:right; color:var(--fg);
         font-family:var(--f-mono); font-size:11px; font-variant-numeric:tabular-nums; }
  .cnt { width:var(--w-cnt); flex:0 0 auto; text-align:right; color:var(--dim);
         font-family:var(--f-mono); font-size:11px; font-variant-numeric:tabular-nums; }
  .sz  { width:var(--w-sz);  flex:0 0 auto; text-align:right; color:var(--dim);
         font-family:var(--f-mono); font-size:11px; font-variant-numeric:tabular-nums; }
  .addr { flex:0 0 auto; color:var(--faint); font-size:11px; font-family:var(--f-mono); }
  .mk { width:16px; flex:0 0 16px; text-align:center; font-size:12px; }
  .mk.y { color:var(--accent); }
  .mk.n { color:var(--mkn); }

  /* Columns are dropped, not squeezed, as the viewport narrows. What survives
     everywhere is what answers "how far along is this, and how big is it?":
     name, bar, percentage, size. The matched/total function count and the ROM
     address are reference detail you look up, not signal you scan, so they
     are the first and second things to go. */
  .cnt, .addr { display:none; }
  @media (min-width:560px) { .cnt { display:block; } }
  @media (min-width:760px) { .addr { display:block; } }

  .children {
    margin-left:var(--indent); border-left:1px solid var(--line);
    padding-left:4px; display:none;
  }
  .open > .children { display:block; }

  /* ---------- footer ---------- */
  footer { padding-block:0 40px; color:var(--dim);
           font-family:var(--f-mono); font-size:11px; line-height:1.8; }
  /* 640px is the site's own reading column (Blog.module.css:31). */
  footer p { margin:0 0 12px; max-width:640px; }
  footer b { color:var(--fg2); font-weight:500; }
  /* Blog.module.css / FormControls.module.css:188-194 warning block. */
  .warn {
    color:var(--warn); background:var(--warn-bg);
    border:1px solid var(--warn-line); border-radius:0; padding:10px 12px;
  }
  .err { color:var(--err); }
  /* Inline code chips, Blog.module.css:275-281. */
  code { font-family:var(--f-mono); font-size:.94em;
         background:var(--field); color:var(--dim); padding:.1em .35em; }
  .warn code { background:rgba(0,0,0,.25); color:inherit; }  /* 7.4:1 */
  .warn b { color:inherit; font-weight:500; }

  /* Fade-through when the dataset is swapped, matching the site's own view
     transition (MainLayout.module.css:309-318). The new content is the
     DEFAULT state, so if the animation never runs nothing is hidden. */
  @keyframes fadeThrough { from { opacity:0; transform:translateY(10px); }
                           to   { opacity:1; transform:none; } }
  #cards, #tree > .node { animation:fadeThrough 300ms ease-out; }

  @media (prefers-reduced-motion:reduce) {
    *, *::before, *::after {
      animation-duration:.01ms !important; animation-iteration-count:1 !important;
      transition-duration:.01ms !important;
    }
  }
</style>
</head>
<body>
<header class="wrap">
  <div class="head">
    <div>
      <h1>ICO decompilation progress</h1>
      <p class="sub">Clean-room PS2 EE-side decomp, grouped by
        <span id="grouplbl">directory</span> &rarr; translation unit &rarr; function.
        <a id="repolink" href="https://github.com/nathanialf/ico/tree/main">repo</a></p>
    </div>
    <div class="verpick">
      <span class="verpick-lbl" id="vlbl">Target build</span>
      <div class="seg" id="vtabs" role="radiogroup" aria-labelledby="vlbl">
        <button type="button" class="seg-btn" role="radio" data-v="pal" aria-checked="true" tabindex="0"
                aria-label="PAL (SCES-50760)" title="PAL (SCES-50760)">
          <span>PAL</span>
        </button>
        <button type="button" class="seg-btn" role="radio" data-v="us" aria-checked="false" tabindex="-1"
                aria-label="NTSC (SLUS-20218)" title="NTSC (SLUS-20218)">
          <span>NTSC</span>
        </button>
        <button type="button" class="seg-btn" role="radio" data-v="aug6" aria-checked="false" tabindex="-1"
                aria-label="Aug-6-2001 prototype" title="Aug-6-2001 prototype">
          <span>Aug-6 proto</span>
        </button>
      </div>
    </div>
  </div>
  <div class="stats" id="cards"></div>
</header>
<main class="wrap">
  <div class="toolbar">
    <input type="search" id="filter" placeholder="filter functions / TUs…" autocomplete="off"
           aria-label="Filter functions and translation units">
    <label class="chk"><input type="checkbox" id="unmatched"> unmatched only</label>
    <label class="chk"><input type="checkbox" id="expand"> expand all</label>
  </div>
  <div id="tree"></div>
</main>
<footer class="wrap" id="foot"></footer>

<script>
const fmtPct = (m,t) => t ? (100*m/t).toFixed(1)+"%" : "–";
const fmtB = n => n>=1048576 ? (n/1048576).toFixed(2)+" MB"
              : n>=1024 ? (n/1024).toFixed(1)+" KB" : n+" B";

// The bar restates the adjacent percentage, so it is decorative to a screen
// reader and hidden from one.
function bar(m,t){ const p=t?100*m/t:0;
  return `<span class="bar" aria-hidden="true"><i style="width:${p.toFixed(2)}%"></i></span>`; }

// `note` (group rows only, optional) explains a bucket that is not a
// programmer directory — the vendor library archives, the .vutext VU1
// microprograms, the "(unassigned)" data-bug bucket. It rides as the button's
// title/aria-description so it can never disturb the row layout.
function nodeRow(name, m, t, mb, tb, cls, note){
  const esc = s => String(s).replace(/&/g,"&amp;").replace(/"/g,"&quot;")
                            .replace(/</g,"&lt;").replace(/>/g,"&gt;");
  return `<button type="button" class="row ${cls}" aria-expanded="false"`
    + (note ? ` title="${esc(note)}" aria-description="${esc(note)}"` : ``) + `>`
    + `<span class="tw" aria-hidden="true"></span>`
    + `<span class="nm">${name}</span>`
    + bar(mb,tb)
    + `<span class="pct">${fmtPct(mb,tb)}</span>`
    + `<span class="cnt">${m}/${t} fn</span>`
    + `<span class="sz">${fmtB(tb)}</span>`
    + `</button>`;
}

// Single place that flips a node open/shut, so `.open` and aria-expanded can
// never drift apart (the click handler, "expand all" and the filter all use it).
function setOpen(node, on){
  node.classList.toggle("open", on);
  node.firstElementChild.setAttribute("aria-expanded", on ? "true" : "false");
}

function render(data){
  // NB: no #ver element — the version picker and the footer name it.
  const T = data.totals;
  const stat = (n,l,frac) =>
    `<div class="card"><span class="n">${n}</span><span class="l">${l}</span>`
    + (frac==null ? "" : bar(frac[0],frac[1])) + `</div>`;
  document.getElementById("cards").innerHTML = [
    stat(`${T.matched_funcs.toLocaleString()} / ${T.total_funcs.toLocaleString()}`, "functions matched"),
    stat(fmtPct(T.matched_funcs,T.total_funcs), "by function count", [T.matched_funcs,T.total_funcs]),
    stat(`${fmtB(T.matched_bytes)} / ${fmtB(T.total_bytes)}`, ".text bytes matched"),
    stat(fmtPct(T.matched_bytes,T.total_bytes), "by code bytes", [T.matched_bytes,T.total_bytes]),
  ].join("");

  const tree = document.getElementById("tree");
  tree.innerHTML = data.programmers.map(p=>{
    const tus = p.tus.map(t=>{
      const funcs = t.funcs.map(f=>
        `<div class="row func" data-name="${f.name}" data-m="${f.matched?1:0}">`
        + `<span class="mk ${f.matched?'y':'n'}" role="img" `
        +   `aria-label="${f.matched?'matched':'not matched'}">${f.matched?'✓':'·'}</span>`
        + `<span class="nm">${f.name}</span>`
        + `<span class="addr">${f.addr}</span>`
        + `<span class="sz">${f.size} B</span>`
        + `</div>`).join("");
      return `<div class="node tu" data-name="${t.path}">`
        + nodeRow(t.name, t.matched_funcs, t.total_funcs, t.matched_bytes, t.total_bytes, "tu")
        + `<div class="children">${funcs}</div></div>`;
    }).join("");
    return `<div class="node prog" data-name="${p.name}">`
      + nodeRow(p.name, p.matched_funcs, p.total_funcs, p.matched_bytes, p.total_bytes, "prog", p.note)
      + `<div class="children">${tus}</div></div>`;
  }).join("");

  // Native <button> rows give Enter/Space activation and focus for free.
  tree.querySelectorAll(".row.prog, .row.tu").forEach(r=>{
    r.addEventListener("click", ()=>
      setOpen(r.parentElement, !r.parentElement.classList.contains("open")));
  });
}

function applyFilter(){
  const q = document.getElementById("filter").value.trim().toLowerCase();
  const unm = document.getElementById("unmatched").checked;
  document.querySelectorAll(".node.tu").forEach(tu=>{
    let any=false;
    tu.querySelectorAll(".row.func").forEach(f=>{
      const okName = !q || f.dataset.name.toLowerCase().includes(q)
                        || tu.dataset.name.toLowerCase().includes(q);
      const okM = !unm || f.dataset.m==="0";
      const show = okName && okM;
      f.style.display = show ? "" : "none";
      if(show) any=true;
    });
    tu.style.display = any || (!q && !unm) ? "" : "none";
    if((q||unm) && any) setOpen(tu, true);
  });
  document.querySelectorAll(".node.prog").forEach(p=>{
    const vis = [...p.querySelectorAll(".node.tu")].some(t=>t.style.display!=="none");
    p.style.display = vis ? "" : "none";
    if((q||unm) && vis) setOpen(p, true);
  });
}

document.getElementById("filter").addEventListener("input", applyFilter);
document.getElementById("unmatched").addEventListener("change", applyFilter);
document.getElementById("expand").addEventListener("change", e=>{
  document.querySelectorAll(".node.prog, .node.tu")
    .forEach(n=> setOpen(n, e.target.checked));
});

const VLABEL = {
  pal:  "PAL (SCES-50760, main branch)",
  us:   "NTSC (SLUS-20218, ntsc branch)",
  aug6: "Aug-6-2001 prototype (aug6 branch)",
};

// Each target is developed on its own branch, so the "repo" link follows the
// selected view rather than always landing on the default branch.
const VBRANCH = { pal: "main", us: "ntsc", aug6: "aug6" };

// Function grouping differs by source layout: the retail targets ship a flat
// repo-root src/ tree, the prototype the dev's per-programmer module dirs.
const VGROUP = { pal: "directory", us: "directory", aug6: "programmer" };

// Default view = the default branch's target.
const VDEFAULT = "pal";

function pickVersion(){
  const h = location.hash.replace("#","");
  return (h in VLABEL) ? h : VDEFAULT;
}

/* --- segmented button: radiogroup keyboard + selection ------------------ */
const segBtns = [...document.querySelectorAll("#vtabs [data-v]")];

function syncSeg(v){
  segBtns.forEach(b=>{
    const on = b.dataset.v === v;
    b.setAttribute("aria-checked", on ? "true" : "false");
    b.tabIndex = on ? 0 : -1;          // roving tabindex: one tab stop total
  });
  // Single point where "the view is now v" is known — keep the repo link on
  // the branch that actually develops this target.
  const rl = document.getElementById("repolink");
  if(rl) rl.href = `https://github.com/nathanialf/ico/tree/${VBRANCH[v] || VBRANCH[VDEFAULT]}`;
}

// The hash is the single source of truth, so pointer, keyboard and deep-link
// selection all take the same path through hashchange -> loadVersion.
function selectVersion(v){
  if(pickVersion() === v) syncSeg(v); else location.hash = v;
}

segBtns.forEach(b => b.addEventListener("click", ()=> selectVersion(b.dataset.v)));
document.getElementById("vtabs").addEventListener("keydown", e=>{
  const i = segBtns.indexOf(document.activeElement);
  if(i < 0 || e.altKey || e.ctrlKey || e.metaKey) return;
  const last = segBtns.length - 1;
  let j;
  switch(e.key){
    case "ArrowRight": case "ArrowDown": j = i===last ? 0 : i+1; break;
    case "ArrowLeft":  case "ArrowUp":   j = i===0 ? last : i-1; break;
    case "Home": j = 0; break;
    case "End":  j = last; break;
    default: return;
  }
  e.preventDefault();
  segBtns[j].focus();                  // selection follows focus (radio pattern)
  selectVersion(segBtns[j].dataset.v);
});

function loadVersion(v){
  syncSeg(v);
  // Per-version JSON lives at <v>/progress.json on the deployed site. The
  // deploy publishes every version, so a miss here means either a local
  // preview (bare docs/ has no version dirs) or a deploy whose other-branch
  // ref was unreadable. Either way fall back to the root compat copy and SAY
  // SO in the footer — a silent fallback would show one version's numbers
  // under another version's tab.
  let fellBack = false;
  fetch(`${v}/progress.json`)
    .catch(()=>null)
    .then(r => (r && r.ok) ? r : (fellBack = true, fetch("progress.json")))
    .then(r=>r.json())
    .then(d=>{
      document.getElementById("grouplbl").textContent =
        VGROUP[d.version] || "programmer";
      render(d); applyFilter();
      const warn = (fellBack && d.version !== v)
        ? `<p class="warn">⚠ No <code>${v}/progress.json</code> was published by the `
          + `last deploy — showing the site-wide fallback copy instead, which holds the `
          + `<b>${VLABEL[d.version] || d.version}</b> data.</p>`
        : "";
      document.getElementById("foot").innerHTML = warn
        + `<p>${VLABEL[d.version] || d.version} &middot; generated by <code>tools/progress_tree.py</code> from `
        + `<code>config/symbol_addrs.${d.version}.txt</code> + per-TU `
        + `<code>INCLUDE_ASM</code> directives. Function sizes are next-symbol deltas. `
        + `Updates on every push to any of the three branches.</p>`
        + `<p>The headline byte figure is the ELF <code>.text</code> section only. `
        + `The <code>.vutext</code> group (VU1 microprograms) is a different section `
        + `and is counted apart from it, so the group rows sum to more than the headline `
        + `by exactly that section's size. The <b>vendor</b> group is library archive `
        + `members (crt0, SCE SDK, newlib/libgcc) linked from pre-built <code>.a</code> `
        + `files — not ICO source; those bytes are already byte-identical in the link, `
        + `assembled from ROM. Policy: <code>decomp/VENDOR.md</code>.</p>`; })
    .catch(e=> document.getElementById("tree").innerHTML =
        `<p class="err">Could not load progress.json: ${e}</p>`);
}

window.addEventListener("hashchange", ()=> loadVersion(pickVersion()));
loadVersion(pickVersion());
</script>
</body>
</html>
